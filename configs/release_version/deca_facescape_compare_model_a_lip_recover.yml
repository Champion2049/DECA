# Lip-focused stability retraining from baseline DECA.
device: "cuda"
output_dir: "./logs/facescape_compare_model_a_lip_recover"
pretrained_modelpath: "./data/deca_model.tar"

model:
  use_tex: False

dataset:
  training_data: ['facescape_list']
  eval_data: ['facescape_list']
  facescape_train_list: "../train_list_wsl.txt"
  facescape_val_list: "../val_list_wsl.txt"
  # Use mismatch-ranked difficult samples to bias training toward visual failures.
  hard_case_csv: "./logs/geometry_audit_real_lmk_FINAL.csv"
  hard_case_boost: 4.0
  batch_size: 4
  K: 1
  isSingle: True
  num_workers: 4
  image_size: 224

loss:
  useSeg: False
  useWlmk: False
  lmk: 1.2
  lmk_type: "smooth_l1"
  lmk_beta: 0.02
  eyed: 0.15
  lipd: 0.35
  photo: 1.5
  id: 0.0
  shape_consistency: True
  reg_shape: 0.0003
  reg_exp: 0.0003
  reg_light: 1.0
  reg_cam: 0.15

train:
  resume: False
  max_epochs: 3
  max_steps: 50000
  lr: 0.000008
  grad_clip_norm: 0.75
  log_steps: 20
  vis_steps: 200
  checkpoint_steps: 200
  val_steps: 500
  eval_steps: 0

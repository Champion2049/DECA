# FaceScape fine-tuning config for flattened 224x224 images.
device: "cpu"
output_dir: "C:/Users/Chirayu/Documents/GitHub/2D-to-3D-image-reconstruction/DECA/logs/facescape_finetune"
pretrained_modelpath: "C:/Users/Chirayu/Documents/GitHub/2D-to-3D-image-reconstruction/DECA/data/deca_model.tar"

dataset:
  training_data: ['facescape_list']
  eval_data: ['facescape_list']
  facescape_train_list: "C:/Users/Chirayu/Documents/GitHub/2D-to-3D-image-reconstruction/train_list.txt"
  facescape_val_list: "C:/Users/Chirayu/Documents/GitHub/2D-to-3D-image-reconstruction/val_list.txt"
  batch_size: 6
  K: 1
  isSingle: True
  num_workers: 2
  image_size: 224

loss:
  # Use rendered visibility mask because no segmentation masks are provided.
  useSeg: False
  useWlmk: False
  lmk: 0.5
  eyed: 0.2
  lipd: 0.1
  photo: 2.0
  id: 0.2
  shape_consistency: False

train:
  resume: True
  max_epochs: 5
  max_steps: 50000
  log_steps: 20
  vis_steps: 200
  checkpoint_steps: 1000
  val_steps: 500
  eval_steps: 1000

# Model B: stronger landmark supervision for pose/expression stability.
device: "cuda"
output_dir: "./logs/facescape_finetune_model_b"
pretrained_modelpath: "./data/deca_model.tar"

model:
  use_tex: False

dataset:
  training_data: ['facescape_list']
  eval_data: ['facescape_list']
  facescape_train_list: "../train_list_wsl.txt"
  facescape_val_list: "../val_list_wsl.txt"
  batch_size: 4
  K: 1
  isSingle: True
  num_workers: 4
  image_size: 224

loss:
  useSeg: False
  useWlmk: True
  lmk: 1.0
  eyed: 0.3
  lipd: 0.2
  photo: 1.5
  id: 0.2
  shape_consistency: False

train:
  resume: True
  max_epochs: 5
  max_steps: 50000
  log_steps: 20
  vis_steps: 200
  checkpoint_steps: 1000
  val_steps: 500
  eval_steps: 1000

# WSL2/Linux fine-tuning config for flattened FaceScape images.
device: "cuda"
output_dir: "./logs/facescape_finetune_wsl"
pretrained_modelpath: "./data/deca_model.tar"

model:
  use_tex: False

dataset:
  training_data: ['facescape_list']
  eval_data: ['facescape_list']
  facescape_train_list: "../train_list_wsl.txt"
  facescape_val_list: "../val_list_wsl.txt"
  batch_size: 4
  K: 1
  isSingle: True
  num_workers: 4
  image_size: 224

loss:
  # Use rendered visibility mask because no segmentation masks are provided.
  useSeg: False
  useWlmk: False
  lmk: 0.5
  eyed: 0.2
  lipd: 0.1
  photo: 2.0
  id: 0.2
  shape_consistency: False

train:
  resume: True
  max_epochs: 5
  max_steps: 50000
  log_steps: 20
  vis_steps: 200
  checkpoint_steps: 1000
  val_steps: 500
  eval_steps: 1000
